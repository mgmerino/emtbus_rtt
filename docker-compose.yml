services:
  web:
    build: .
    ports:
      - "${PORT:-9292}:9292"
    environment:
      - EMT_CLIENT_ID=${EMT_CLIENT_ID}
      - EMT_PASS_KEY=${EMT_PASS_KEY}
      - PORT=9292
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9292/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Development service with live reload
  dev:
    build: .
    ports:
      - "${PORT:-9292}:9292"
    environment:
      - EMT_CLIENT_ID=${EMT_CLIENT_ID}
      - EMT_PASS_KEY=${EMT_PASS_KEY}
      - PORT=9292
    volumes:
      - ./lib:/app/lib:ro
      - ./web:/app/web:ro
      - ./exe:/app/exe:ro
    profiles:
      - dev

